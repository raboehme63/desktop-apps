[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitnesscore"
version = "0.1.0"
description = "GUI-free library for a local fitness SQLite store (Polar JSON and FIT)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Travel Journal contributors" }]
dependencies = [
    "sqlalchemy>=2.0.36",
    "fitdecode>=0.11.0",
]

[project.scripts]
fitnessdb = "fitnesscore.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]
