[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traveljournal"
version = "2.2.0"
description = "Windows desktop app that builds an editable travel journal from photos and GPS tracks."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",
]

[project.scripts]
traveljournal = "traveljournal.main:main"
